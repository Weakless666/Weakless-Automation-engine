name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wae_owner
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: wae
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wae_owner -d wae" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit, integration and security tests (SQLite)
        run: pytest -q
      - name: Migrations apply cleanly on PostgreSQL (including Row Level Security)
        env:
          WAE_ENV: test
          WAE_DATABASE_URL: postgresql://wae_owner:ci-password@localhost:5432/wae
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
