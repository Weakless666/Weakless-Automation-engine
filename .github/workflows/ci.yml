name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: wae_owner
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: wae
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wae_owner -d wae" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r requirements.txt
      - name: Unit, integration and security tests (SQLite)
        run: pytest -q
      - name: Migrations apply cleanly on PostgreSQL (including Row Level Security)
        env:
          WAE_ENV: test
          WAE_DATABASE_URL: postgresql://wae_owner:ci-password@localhost:5432/wae
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base
          alembic upgrade head
      - name: All tests on PostgreSQL as a role subject to Row Level Security
        env:
          PGPASSWORD: ci-password
          WAE_TEST_DATABASE_URL: postgresql://wae_app:app-password@localhost:5432/wae_test
        run: |
          psql -h localhost -U wae_owner -d wae -v ON_ERROR_STOP=1 \
            -c "CREATE ROLE wae_app LOGIN PASSWORD 'app-password' NOSUPERUSER NOBYPASSRLS" \
            -c "CREATE DATABASE wae_test OWNER wae_app"
          pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Python packages have no known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit -r backend/requirements.txt --progress-spinner off
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: npm packages have no known high or critical vulnerabilities
        working-directory: frontend
        run: npm audit --audit-level=high

  e2e:
    name: browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Builder end-to-end tests
        run: npx playwright test
        working-directory: frontend
        env:
          E2E_PYTHON: python
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
