# Weakless Automation Engine - single-host deployment.
# Copy .env.example to .env, fill in the secrets, then:  docker compose up -d --build
#
# The API connects as the non-superuser role `wae_app` so PostgreSQL Row Level
# Security applies to it (superusers bypass RLS).

x-backend-env: &backend-env
  WAE_ENV: production
  WAE_DATABASE_URL: postgresql://wae_app:${WAE_DB_PASSWORD:?set WAE_DB_PASSWORD}@postgres:5432/wae
  WAE_SECRET_KEY: ${WAE_SECRET_KEY:?set WAE_SECRET_KEY}
  WAE_MASTER_KEYS: ${WAE_MASTER_KEYS:?set WAE_MASTER_KEYS}
  WAE_ACTIVE_KEY_ID: ${WAE_ACTIVE_KEY_ID:-}
  WAE_PUBLIC_BASE_URL: ${WAE_PUBLIC_BASE_URL:-http://localhost:3000}
  WAE_FRONTEND_URL: ${WAE_FRONTEND_URL:-http://localhost:3000}
  WAE_CORS_ORIGINS: ${WAE_FRONTEND_URL:-http://localhost:3000}
  WAE_COOKIE_SECURE: ${WAE_COOKIE_SECURE:-false}
  WAE_BOOTSTRAP_ADMIN_EMAIL: ${WAE_BOOTSTRAP_ADMIN_EMAIL:-}
  WAE_BOOTSTRAP_ADMIN_PASSWORD: ${WAE_BOOTSTRAP_ADMIN_PASSWORD:-}
  WAE_ANTHROPIC_API_KEY: ${WAE_ANTHROPIC_API_KEY:-}
  WAE_OPENAI_API_KEY: ${WAE_OPENAI_API_KEY:-}
  WAE_GEMINI_API_KEY: ${WAE_GEMINI_API_KEY:-}
  WAE_SMTP_HOST: ${WAE_SMTP_HOST:-}
  WAE_SMTP_PORT: ${WAE_SMTP_PORT:-587}
  WAE_SMTP_USERNAME: ${WAE_SMTP_USERNAME:-}
  WAE_SMTP_PASSWORD: ${WAE_SMTP_PASSWORD:-}
  WAE_SMTP_FROM: ${WAE_SMTP_FROM:-}
  WAE_STRIPE_SECRET_KEY: ${WAE_STRIPE_SECRET_KEY:-}
  WAE_STRIPE_WEBHOOK_SECRET: ${WAE_STRIPE_WEBHOOK_SECRET:-}
  WAE_SENTRY_DSN: ${WAE_SENTRY_DSN:-}
  WAE_OAUTH_GOOGLE_CLIENT_ID: ${WAE_OAUTH_GOOGLE_CLIENT_ID:-}
  WAE_OAUTH_GOOGLE_CLIENT_SECRET: ${WAE_OAUTH_GOOGLE_CLIENT_SECRET:-}
  WAE_OAUTH_MICROSOFT_CLIENT_ID: ${WAE_OAUTH_MICROSOFT_CLIENT_ID:-}
  WAE_OAUTH_MICROSOFT_CLIENT_SECRET: ${WAE_OAUTH_MICROSOFT_CLIENT_SECRET:-}
  WAE_OAUTH_SALESFORCE_CLIENT_ID: ${WAE_OAUTH_SALESFORCE_CLIENT_ID:-}
  WAE_OAUTH_SALESFORCE_CLIENT_SECRET: ${WAE_OAUTH_SALESFORCE_CLIENT_SECRET:-}
  WAE_OAUTH_LINKEDIN_CLIENT_ID: ${WAE_OAUTH_LINKEDIN_CLIENT_ID:-}
  WAE_OAUTH_LINKEDIN_CLIENT_SECRET: ${WAE_OAUTH_LINKEDIN_CLIENT_SECRET:-}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: wae_owner
      POSTGRES_PASSWORD: ${WAE_DB_OWNER_PASSWORD:?set WAE_DB_OWNER_PASSWORD}
      POSTGRES_DB: wae
      WAE_DB_PASSWORD: ${WAE_DB_PASSWORD:?set WAE_DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres-init.sh:/docker-entrypoint-initdb.d/10-wae.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wae_owner -d wae"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *backend-env
      # Migrations run as the owning role (DDL); the app itself never does.
      WAE_DATABASE_URL: postgresql://wae_owner:${WAE_DB_OWNER_PASSWORD}@postgres:5432/wae
    depends_on:
      postgres: { condition: service_healthy }
    restart: "no"

  api:
    build: ./backend
    restart: unless-stopped
    environment:
      <<: *backend-env
      WAE_EMBEDDED_WORKER: "false"
    depends_on:
      migrate: { condition: service_completed_successfully }

  worker:
    build: ./backend
    restart: unless-stopped
    command: ["python", "-m", "app.cli", "worker"]
    environment: *backend-env
    healthcheck: { disable: true }
    depends_on:
      migrate: { condition: service_completed_successfully }
    deploy:
      replicas: ${WAE_WORKER_REPLICAS:-1}

  web:
    build:
      context: ./frontend
    restart: unless-stopped
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "${WAE_HTTP_PORT:-3000}:3000"
    depends_on:
      - api

  backup:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      PGPASSWORD: ${WAE_DB_OWNER_PASSWORD}
      BACKUP_KEEP_DAYS: ${WAE_BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      postgres: { condition: service_healthy }

volumes:
  pgdata:
